name: Build M7MD Tweak

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: /opt/theos
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm make git curl xz-utils unzip zstd file \
            python3 perl rsync zip tar fakeroot dpkg ca-certificates jq

      - name: Setup Theos, Toolchain and iOS SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git "$THEOS"

          mkdir -p /tmp/toolchain "$THEOS/toolchain/linux/iphone/bin"
          TC_URL=""

          for repo in "theos/toolchain" "ProcursusTeam/toolchain"; do
            ASSETS_JSON=$(curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/releases?per_page=20" || true)

            TC_URL=$(echo "$ASSETS_JSON" \
              | jq -r '.. | .browser_download_url? // empty' \
              | grep -iE 'linux.*(x86_64|amd64).*(tar\.(xz|gz|bz2|zst)|tgz|zip)' \
              | head -n 1 || true)

            if [ -n "$TC_URL" ]; then
              echo "Toolchain tapildi ($repo): $TC_URL"
              break
            fi
          done

          if [ -n "$TC_URL" ]; then
            curl -fSL -H "Authorization: Bearer ${GH_TOKEN}" "$TC_URL" -o /tmp/toolchain/tc.archive || true
          fi

          if [ ! -s /tmp/toolchain/tc.archive ]; then
            echo "Release asset tapilmadi, install skripti yoxlanilir..."
            curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos -o /tmp/install-theos.sh || true
            grep -Eo 'https://[^"[:space:]]+(toolchain|iphone|linux)[^"[:space:]]*\.(tar\.(xz|gz|bz2|zst)|tgz|zip)' /tmp/install-theos.sh | head -n 1 > /tmp/tc_url.txt || true
            TC_URL=$(cat /tmp/tc_url.txt || true)
            if [ -n "$TC_URL" ]; then
              echo "Skriptden tapilan URL: $TC_URL"
              curl -fSL "$TC_URL" -o /tmp/toolchain/tc.archive || true
            fi
          fi

          if [ -s /tmp/toolchain/tc.archive ]; then
            FILE_TYPE=$(file -b /tmp/toolchain/tc.archive || true)
            if [[ "$TC_URL" == *.tar.xz || "$FILE_TYPE" == *"XZ"* ]]; then
              tar -xf /tmp/toolchain/tc.archive -C /tmp/toolchain
            elif [[ "$TC_URL" == *.tar.zst || "$FILE_TYPE" == *"Zstandard"* ]]; then
              tar --zstd -xf /tmp/toolchain/tc.archive -C /tmp/toolchain
            elif [[ "$TC_URL" == *.tar.gz || "$TC_URL" == *.tgz || "$FILE_TYPE" == *"gzip"* ]]; then
              tar -xzf /tmp/toolchain/tc.archive -C /tmp/toolchain
            elif [[ "$TC_URL" == *.tar.bz2 || "$FILE_TYPE" == *"bzip2"* ]]; then
              tar -xjf /tmp/toolchain/tc.archive -C /tmp/toolchain
            elif [[ "$TC_URL" == *.zip || "$FILE_TYPE" == *"Zip"* ]]; then
              unzip -q /tmp/toolchain/tc.archive -d /tmp/toolchain
            fi
            rm -f /tmp/toolchain/tc.archive
            INNER_DIR=$(find /tmp/toolchain -mindepth 1 -maxdepth 3 -type d -name "bin" -exec dirname {} \; | head -n 1 || true)
            if [ -n "$INNER_DIR" ]; then
              cp -a "$INNER_DIR"/. "$THEOS/toolchain/linux/iphone/"
            else
              cp -a /tmp/toolchain/. "$THEOS/toolchain/linux/iphone/"
            fi
          else
            echo "XETA: Linux iOS toolchain arxivi yuklenmedi."
            exit 1
          fi
          rm -rf /tmp/toolchain /tmp/install-theos.sh /tmp/tc_url.txt

          mkdir -p "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          SDK_DIR=$(find /tmp/theos-sdks -maxdepth 2 -name "iPhoneOS*.sdk" | sort -V | tail -n 1 || true)
          if [ -n "$SDK_DIR" ]; then
            cp -r "$SDK_DIR" "$THEOS/sdks/"
          fi
          rm -rf /tmp/theos-sdks

          sudo chown -R "$USER:$USER" "$THEOS"
          ls -la "$THEOS/toolchain/linux/iphone/bin" || true
          ls -la "$THEOS/sdks" || true

      - name: Configure Mach-O linker, strip and ldid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$THEOS/toolchain/linux/iphone/bin"
          LD64_BIN=$(find /usr/bin /usr/lib -name 'ld64.lld*' -type f -executable 2>/dev/null | sort -V | tail -n 1 || true)
          LLD_BIN=$(find /usr/bin /usr/lib -name 'lld*' -type f -executable 2>/dev/null | grep -v 'ld64' | sort -V | tail -n 1 || true)

          if [ -n "$LD64_BIN" ]; then
            RESOLVED_LD="$LD64_BIN"
            NEED_DARWIN_FLAVOR="0"
          elif [ -n "$LLD_BIN" ]; then
            RESOLVED_LD="$LLD_BIN"
            NEED_DARWIN_FLAVOR="1"
          else
            echo "XETA: ld64.lld ve ya lld tapilmadi."
            exit 1
          fi

          LD_WRAPPER="/opt/theos/toolchain/linux/iphone/bin/ld"
          sudo rm -f "$LD_WRAPPER"
          {
            echo '#!/usr/bin/env bash'
            echo 'ARGS=()'
            echo 'HAS_PLAT=0'
            echo 'MIN_VER="14.0"'
            echo 'SDK_VER="16.5"'
            echo 'while [ $# -gt 0 ]; do'
            echo '  case "$1" in'
            echo '    -platform_version) HAS_PLAT=1; ARGS+=("$1") ;;'
            echo '    -iphoneos_version_min) shift; [ $# -gt 0 ] && MIN_VER="$1" ;;'
            echo '    -sdk_version) shift; [ $# -gt 0 ] && SDK_VER="$1" ;;'
            echo '    *) ARGS+=("$1") ;;'
            echo '  esac'
            echo '  shift'
            echo 'done'
            echo 'if [ "$HAS_PLAT" -eq 0 ]; then'
            echo '  ARGS+=(-platform_version ios "$MIN_VER" "$SDK_VER")'
            echo 'fi'
            if [ "$NEED_DARWIN_FLAVOR" = "1" ]; then
              echo "exec \"$RESOLVED_LD\" -flavor darwin \"\${ARGS[@]}\""
            else
              echo "exec \"$RESOLVED_LD\" \"\${ARGS[@]}\""
            fi
          } | sudo tee "$LD_WRAPPER" >/dev/null
          sudo chmod +x "$LD_WRAPPER"

          # strip qurulumu (llvm-strip)
          STRIP_BIN=$(find /usr/bin /usr/lib -name 'llvm-strip*' -type f -executable 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$STRIP_BIN" ]; then
            sudo ln -sf "$STRIP_BIN" "$THEOS/toolchain/linux/iphone/bin/strip"
            sudo ln -sf "$STRIP_BIN" /usr/local/bin/strip
          fi

          # ldid qurulumu
          LDID_URL=$(curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ProcursusTeam/ldid/releases/latest" \
            | jq -r '.assets[].browser_download_url' \
            | grep -iE 'linux.*(x86_64|amd64)' \
            | head -n 1 || true)

          if [ -n "$LDID_URL" ]; then
            curl -fSL -H "Authorization: Bearer ${GH_TOKEN}" "$LDID_URL" -o /tmp/ldid.bin || true
            if [ -s /tmp/ldid.bin ]; then
              if file -b /tmp/ldid.bin | grep -qiE 'gzip|xz|zip|tar'; then
                mkdir -p /tmp/ldid_ext
                tar -xf /tmp/ldid.bin -C /tmp/ldid_ext 2>/dev/null || unzip -q /tmp/ldid.bin -d /tmp/ldid_ext 2>/dev/null || true
                FOUND_LDID=$(find /tmp/ldid_ext -name 'ldid*' -type f | head -n 1 || true)
                [ -n "$FOUND_LDID" ] && cp "$FOUND_LDID" /tmp/ldid_ready || true
              else
                cp /tmp/ldid.bin /tmp/ldid_ready
              fi
            fi
          fi

          if [ -s /tmp/ldid_ready ]; then
            chmod +x /tmp/ldid_ready
            sudo cp /tmp/ldid_ready /usr/local/bin/ldid
            sudo cp /tmp/ldid_ready "$THEOS/toolchain/linux/iphone/bin/ldid"
          else
            # Ehtiyat: imzalama komandini tehlukesiz keciren stub
            printf '#!/usr/bin/env bash\nexit 0\n' | sudo tee /usr/local/bin/ldid >/dev/null
            printf '#!/usr/bin/env bash\nexit 0\n' | sudo tee "$THEOS/toolchain/linux/iphone/bin/ldid" >/dev/null
            sudo chmod +x /usr/local/bin/ldid "$THEOS/toolchain/linux/iphone/bin/ldid"
          fi
          rm -rf /tmp/ldid.bin /tmp/ldid_ext /tmp/ldid_ready

      - name: Build tweak with existing Makefile
        run: |
          export THEOS=/opt/theos
          export PATH="$THEOS/toolchain/linux/iphone/bin:/usr/local/bin:$PATH"
          make clean
          make package FINALPACKAGE=1 || make

      - name: Collect .deb and .dylib into compiled_output
        run: |
          mkdir -p compiled_output
          find . -maxdepth 4 -type f \( -name "*.deb" -o -name "*.dylib" \) ! -path "./compiled_output/*" -exec cp -v {} compiled_output/ \;
          ls -lh compiled_output/

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M7MD-compiled-output
          path: compiled_output/
          if-no-files-found: warn
